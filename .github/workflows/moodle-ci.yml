name: Moodle Plugin CI

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        # Define a matrix of PHP versions, Moodle branches, and databases to test against.
        # Currently, we are only testing against Moodle 4.5 (MOODLE_405_STABLE) as 5.0+ is not yet supported by this plugin.
        include: &moodle_matrix
          - php: '8.2'
            moodle-branch: 'MOODLE_405_STABLE'
            database: 'pgsql'
          - php: '8.2'
            moodle-branch: 'MOODLE_405_STABLE'
            database: 'mariadb'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=6000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8

      - name: Install moodle-plugin-ci
        run: |
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ always() }}
        run: moodle-plugin-ci phplint ./plugin

      - name: PHP Copy/Paste Detector
        if: ${{ always() }}
        run: moodle-plugin-ci phpcpd ./plugin

      - name: PHP Mess Detector
        continue-on-error: true # This step shows warnings but does not fail the build.
        if: ${{ always() }}
        run: moodle-plugin-ci phpmd ./plugin

      - name: Moodle Code Checker
        if: ${{ always() }}
        run: moodle-plugin-ci codechecker --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ always() }}
        run: moodle-plugin-ci phpdoc

      - name: Validating
        if: ${{ always() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ always() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ always() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ always() }}
        run: moodle-plugin-ci grunt

      - name: PHPUnit tests
        if: ${{ always() }}
        run: |
          moodle-plugin-ci phpunit
          moodle-plugin-ci phpunit ./plugin/type/poll
          moodle-plugin-ci phpunit ./plugin/type/text

  behat:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: *moodle_matrix

    env:
      MOODLE_DOCKER_WWWROOT: ${{ github.workspace }}/moodle
      MOODLE_DOCKER_DB: ${{ matrix.database }}
      MOODLE_DOCKER_PHP_VERSION: ${{ matrix.php }}
      MOODLE_DOCKER_BROWSER: chrome

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out moodle-docker
        uses: actions/checkout@v4
        with:
          repository: moodlehq/moodle-docker
          path: moodle-docker

      - name: Check out Moodle core
        uses: actions/checkout@v4
        with:
          repository: moodle/moodle
          ref: ${{ matrix.moodle-branch }}
          path: moodle

      - name: Detect Moodle directory layout
        run: |
          if [[ -d moodle/public ]]; then
            echo "MOODLE_PUBLIC_ROOT=public" >> "$GITHUB_ENV"
            echo "MOODLE_PLUGIN_ROOT=moodle/public" >> "$GITHUB_ENV"
          else
            echo "MOODLE_PUBLIC_ROOT=." >> "$GITHUB_ENV"
            echo "MOODLE_PLUGIN_ROOT=moodle" >> "$GITHUB_ENV"
          fi

      - name: Install plugin into Moodle codebase
        run: |
          mkdir -p "${MOODLE_PLUGIN_ROOT}/mod/response"
          cp -r plugin/. "${MOODLE_PLUGIN_ROOT}/mod/response/"

      - name: Configure Moodle for moodle-docker
        working-directory: moodle-docker
        run: |
          cp config.docker-template.php "${MOODLE_DOCKER_WWWROOT}/config.php"
          # Insert our custom settings before the mandatory trailing setup.php
          # require (Moodle's config.php must end with that require_once call).
          # This enables browser console-log capture, matching the diagnostic
          # behat_mod_response.php hook used to find the "No define call"
          # RequireJS failures, and a faildump path for artifact upload.
          sed -i "/require_once(__DIR__ . '\/lib\/setup.php');/i \\
          \$CFG->behat_increasetimeout = 3;\\
          \$CFG->behat_config = ['default' => ['extensions' => ['Behat\\\\\\\\MinkExtension' => ['webdriver' => ['capabilities' => ['extra_capabilities' => ['goog:loggingPrefs' => ['browser' => 'ALL']]]]]]]];" \
            "${MOODLE_DOCKER_WWWROOT}/config.php"

      - name: Start moodle-docker and initialise Behat
        working-directory: moodle-docker
        run: |
          bin/moodle-docker-compose pull
          bin/moodle-docker-compose up -d
          bin/moodle-docker-wait-for-db
          bin/moodle-docker-compose exec -T webserver \
            php "${MOODLE_PUBLIC_ROOT}/admin/tool/behat/cli/init.php"

      - name: Behat features
        working-directory: moodle-docker
        # Runs against a real web server (Apache/PHP-FPM in the webserver container),
        # unlike moodle-plugin-ci's Behat command which uses PHP's built-in dev server -
        # avoiding the intermittent "No define call" RequireJS failures seen in CI.
        run: |
          bin/moodle-docker-compose exec -T webserver \
            php "${MOODLE_PUBLIC_ROOT}/admin/tool/behat/cli/run.php" --tags="@mod_response"

      - name: Copy Behat faildumps
        if: ${{ failure() }}
        working-directory: moodle-docker
        run: bin/moodle-docker-compose cp webserver:/var/www/behatfaildumps "${{ github.workspace }}/faildumps" || true

      - name: Upload Behat faildump
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: behat-faildump
          path: ${{ github.workspace }}/faildumps
          if-no-files-found: ignore

      - name: Stop moodle-docker
        if: ${{ always() }}
        working-directory: moodle-docker
        run: bin/moodle-docker-compose down
